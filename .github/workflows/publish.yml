name: Test and publish

# Every push and PR runs the tests on Windows PowerShell 5.1 (Pester 3.4.0 ships with Windows).
# A tag v<version> also publishes to npm through Trusted Publishing (OIDC): no token, works with passkey 2FA.
# Release: npm version patch|minor  ->  git push --follow-tags

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-tests.ps1

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} does not match package.json v$v" }
      - name: npm >= 11.5.1 (Trusted Publishing)
        run: npm install -g npm@^11.5.1
      - run: npm publish
